---
paths:
  /journals/{username}/entries/{entry_id}:
    parameters:
      - name: username
        in: path
        description: The journal you want entry information for
        required: true
        schema:
          $ref: ../components/schemas/username.yaml
      - name: entry_id
        in: path
        description: The entry id you want information for
        required: true
        schema:
          type: integer
    get:
      description: Returns a specified entry in a journal.
      responses:
        200:
          description: A single entry
        404:
          description: Journal or entry specified does not exist.
          schema:
            $ref: ../components/error.yaml
        403:
          description: You aren't authorized to view that entry.
          schema:
            $ref: ../components/error.yaml
        401:
          $ref: ../components/errors/401.yaml
        500:
          $ref: ../components/errors/500.yaml
    post:
      description: Edit a specified journal entry. Fields left out of the request keep their current values.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  description: Entry subject line
                text:
                  type: string
                  description: Entry text
                  minLength: 1
                icon:
                  type: string
                  description: Keyword of icon to use
                datetime:
                  type: string
                  description: The date and time of the entry in the format `YYYY-MM-DD hh:mm`. If omitted, the entry's current date and time are kept.
                security:
                  type: string
                  description: Security level to use. Can be `public`, `private`, or `access`.
                  enum:
                    - public
                    - private
                    - access
                age_restriction:
                  type: string
                  description: Age restriction flag. `none` puts no flags on the entry, `discretion` marks it as "viewer discretion advised", and `restricted` marks it inacessible to users under eighteen. If omitted, the current setting is kept.
                  enum:
                    - none
                    - discretion
                    - restricted
                age_restriction_reason:
                  type: string
                  description: A optional description of why you chose the age-restriction setting you did.
                comment_settings:
                  type: string
                  description: Comment settings for the new entry. `nocomments` disables comments, and `noemail` disables notifications. If omitted, the current setting is kept.
                tags:
                  description: An array of tags to apply to the entry.
                  type: array
                  items:
                    type: string
                current_location:
                  type: string
                  description: Current location (does not have to be a real location)
                current_music:
                  type: string
                  description: Current music
                current_mood:
                  type: string
                  description: Current mood
                admin_post:
                  type: boolean
                  description: Mark a post with the admin flag (ignored if you are not an admin or posting to a community)
                sticky_entry:
                  type: boolean
                  description: Mark an entry sticky (ignored if you are at your max count of stickied entries)
                crosspost:
                  type: boolean
                  description: Schedule for crosspost, using the account's default crosspost accounts.
      responses:
        200:
          description: A link to the updated entry.
        400:
          $ref: ../components/errors/400.yaml
        404:
          description: Journal or entry specified does not exist.
          schema:
            $ref: ../components/error.yaml
        403:
          description: You aren't allowed to edit that entry.
          schema:
            $ref: ../components/error.yaml
        401:
          $ref: ../components/errors/401.yaml
        500:
          $ref: ../components/errors/500.yaml
