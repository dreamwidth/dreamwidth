type: object
required:
- comment
- picid
- username
- url
- keywords
- default
properties:
  comment:
    type: string
  picid:
    type: integer
  username:
    type: string
    description: The name of the journal this icon belongs to.
  url:
    type: string
  keywords:
    type: array
    items:
      type: string
  default:
    type: boolean
    description: Whether this is the default icon of the journal it belongs to.
